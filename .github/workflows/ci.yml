name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build (static export)
        run: npm run build

      - name: Guard — no real secrets in the client bundle
        run: |
          set -e
          # Actual key material only (not library prefix checks like "sb_secret_").
          #  - Supabase secret keys:            sb_secret_ + >=20 key chars
          #  - Gemini / Google API keys:        AIza + >=30 chars
          #  - PEM private keys
          #  - a JWT whose payload contains "service_role"
          PATTERN='sb_secret_[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if grep -rIlE "$PATTERN" out .next/static 2>/dev/null; then
            echo "::error::Real secret material found in the client build output."
            exit 1
          fi
          if grep -rhoE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' out .next/static 2>/dev/null \
             | while read -r jwt; do
                 payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
                 echo "$payload" | grep -q 'service_role' && echo FOUND
               done | grep -q FOUND; then
            echo "::error::A service_role JWT is present in the client build output."
            exit 1
          fi
          echo "No real secrets in the client bundle."

  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build (local, no env)
        run: npm run build:local
      - name: CSP — no violations, core directives present
        run: npm run csp:check
      - name: PWA — offline coverage, no secrets cached
        run: npm run pwa:check
